<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela-login</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="estilos/style-all.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="ima">
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a). Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="#" autocomplete="off" method="post">
                    <p class="bot">
                        <i class="material-symbols-outlined">person</i>
                        <input id="ilogin" required maxlength="30" placeholder="nome usuario" type="email">
                        <label for="ilogin">
                        </label>
                    </p>
                    <p class="bot">
                        <i class="material-symbols-outlined">passkey</i>
                        <input id="isen" required minlength="8"  placeholder="***********" type="password">
                        <label for="isen">
                        </label>
                    </p>
                    <div id="botao">
                        <input id="env" type="submit" value="Enviar">
                        <input id="sen" type="submit" value="Esqueci minha senha">
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
